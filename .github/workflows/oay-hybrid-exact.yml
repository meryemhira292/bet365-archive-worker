name: OAY V9 Hybrid Private Exact
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oay-hybrid-exact.yml'
      - 'oay/hybrid_inbox/**'
      - 'oay/hybrid_bridge.py'
      - 'oay/hybrid_exact_worker.py'
  schedule:
    - cron: "43 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: oay-v9-hybrid-private-exact
  cancel-in-progress: false

jobs:
  hybrid-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      OAY_AES256_KEY_B64: ${{ secrets.OAY_AES256_KEY_B64 }}
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private exact dependencies
        run: python -m pip install 'numpy>=2,<2.3' 'numba>=0.61,<0.65' 'cryptography>=45,<47'
      - name: Verify bridge source and synthetic encrypted roundtrip
        run: |
          python -m py_compile oay/hybrid_bridge.py oay/hybrid_exact_worker.py oay/test_hybrid_bridge.py
          python oay/test_hybrid_bridge.py
      - name: Decrypt the unchanged canonical private exact engine
        shell: bash
        run: |
          python - <<'PY'
          import base64,glob,hashlib,io,json,os,pathlib,zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          text=os.environ.get("OAY_AES256_KEY_B64","")
          if not text: raise RuntimeError("Missing OAY AES secret")
          key=base64.b64decode(text,validate=True)
          if len(key)!=32:raise RuntimeError("Invalid AES key length")
          files=sorted(glob.glob("oay/private_payload.part*"))
          if not files: raise RuntimeError("Private bundle missing")
          cipher=b"".join(pathlib.Path(p).read_bytes() for p in files)
          plain=AESGCM(key).decrypt(cipher[:12],cipher[12:],None)
          root=pathlib.Path("private");root.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(plain)) as z:
            manifest=json.loads(z.read("BUNDLE_MANIFEST_SHA256.json"))
            for name,digest in manifest.items():
              p=pathlib.PurePosixPath(name)
              if p.is_absolute() or ".." in p.parts:raise ValueError("Unsafe bundle path")
              if hashlib.sha256(z.read(name)).hexdigest()!=digest:raise ValueError("Bundle SHA error "+name)
            z.extractall(root)
          print("Canonical private 2018-2025 inputs verified. No 2026 input.")
          PY
      - name: Publish only the safe encryption public key
        run: python oay/hybrid_bridge.py public-key
      - name: Process encrypted hybrid inbox independently
        run: python oay/hybrid_exact_worker.py
      - name: Keep the new independent state AES-GCM encrypted
        uses: actions/upload-artifact@v4
        with:
          name: oay-hybrid-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: hybrid_state.enc
          retention-days: 90
          if-no-files-found: ignore
