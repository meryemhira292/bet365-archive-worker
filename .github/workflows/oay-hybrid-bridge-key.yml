name: OAY Hybrid Bridge Public Key
on:
  workflow_dispatch:
  schedule:
    - cron: "31 * * * *"

permissions:
  contents: read

jobs:
  publish-public-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OAY_AES256_KEY_B64: ${{ secrets.OAY_AES256_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography
        run: python -m pip install 'cryptography>=45,<47'
      - name: Print public encryption key only (never master secret)
        run: python oay/hybrid_bridge.py public-key
